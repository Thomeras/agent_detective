server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hash-based routing means all navigation resolves to index.html; the
    # fallback keeps any accidental deep-link path serving the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
