server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hash-based routing means all navigation resolves to index.html; the
    # fallback keeps any accidental deep-link path serving the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the app shell: it points at hashed /assets bundles, so a stale
    # index.html is exactly how a browser keeps rendering an old build.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Hashed bundle filenames change every build, so they are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
