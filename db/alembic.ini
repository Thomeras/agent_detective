# Alembic configuration for the Agent Detective Postgres schema.
# The database URL is NOT stored here; db/alembic/env.py reads it from
# the DATABASE_URL environment variable.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Placeholder only; always overridden by DATABASE_URL in env.py.
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/agent_detective

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
