[project]
name = "detective-ci"
version = "0.1.0"
description = "Deterministic blame-level golden replay + CI gate for Agent Detective (roadmap 2.5)"
authors = [{ name = "Tomáš Jeřábek" }]
requires-python = ">=3.12"
# BUSL-1.1 is the SPDX identifier for the Business Source License 1.1 (BSL-1.0
# is Boost's, an entirely different licence — do not "fix" this to BSL).
license = "BUSL-1.1"
dependencies = [
    "blame-engine",
]

[project.urls]
Homepage = "https://github.com/Thomeras/agent_detective"

[tool.uv.sources]
blame-engine = { workspace = true }

[project.entry-points.pytest11]
detective_ci = "detective_ci.plugin"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
