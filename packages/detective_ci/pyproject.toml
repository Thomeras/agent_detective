[project]
name = "detective-ci"
version = "0.1.1"
description = "Deterministic blame-level golden replay + CI gate for Agent Detective (roadmap 2.5)"
authors = [{ name = "Tomáš Jeřábek" }]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "blame-engine",
]

[project.urls]
Homepage = "https://github.com/Thomeras/agent_detective"

[tool.uv.sources]
blame-engine = { workspace = true }

[project.entry-points.pytest11]
detective_ci = "detective_ci.plugin"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
