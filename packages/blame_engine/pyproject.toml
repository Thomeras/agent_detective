[project]
name = "blame-engine"
version = "0.3.0"
description = "Pure, I/O-free blame analysis engine for multi-agent execution graphs"
authors = [{ name = "Tomáš Jeřábek" }]
requires-python = ">=3.12"
# BUSL-1.1 is the SPDX identifier for the Business Source License 1.1 (BSL-1.0
# is Boost's, an entirely different licence — do not "fix" this to BSL).
license = "BUSL-1.1"
dependencies = [
    "networkx>=3.3",
]

[project.urls]
Homepage = "https://github.com/Thomeras/agent_detective"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
