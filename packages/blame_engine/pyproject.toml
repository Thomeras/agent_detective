[project]
name = "blame-engine"
version = "0.1.0"
description = "Pure, I/O-free blame analysis engine for multi-agent execution graphs"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
