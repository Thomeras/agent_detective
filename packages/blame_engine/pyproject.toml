[project]
name = "blame-engine"
version = "0.4.2"
description = "Pure, I/O-free blame analysis engine for multi-agent execution graphs"
authors = [{ name = "Tomáš Jeřábek" }]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "networkx>=3.3",
]

[project.urls]
Homepage = "https://github.com/Thomeras/agent_detective"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
