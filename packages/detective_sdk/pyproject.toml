[project]
name = "detective-sdk"
version = "0.3.1"
description = "Universal, dependency-free instrumentation helpers for Agent Detective conventions"
authors = [{ name = "Tomáš Jeřábek" }]
requires-python = ">=3.12"
# Apache rather than MIT for the express patent grant: this package is imported
# INTO the user's own agent process and ships inside their product.
license = "Apache-2.0"
license-files = ["LICENSE"]
# Zero dependencies is a feature, not an oversight: instrumentation runs inside
# the agent's own process, so it must not drag a judge, a database or the
# OpenTelemetry SDK in with it.
dependencies = []

[project.urls]
Homepage = "https://github.com/Thomeras/agent_detective"

[project.optional-dependencies]
# For `detective_sdk.otel.collect`, which attaches to an existing tracer
# provider. Anyone who needs that bridge already has the SDK installed — the
# extra just makes the requirement explicit. The module itself imports OTel
# lazily and its transforms are testable without it.
otel = ["opentelemetry-sdk>=1.20"]
# For `detective_sdk.langgraph`, which hooks node runs through LangGraph's
# callback seam. langgraph pulls in langchain-core, the only import the
# adapter needs; the module imports it lazily and raises at construction
# without it.
langgraph = ["langgraph>=0.2"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
