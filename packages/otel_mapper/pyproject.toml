[project]
name = "otel-mapper"
version = "0.3.0"
description = "OTLP/HTTP JSON span to AgentRun/Edge candidate mapping (Apache-2.0)"
authors = [{ name = "Tomáš Jeřábek" }]
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/Thomeras/agent_detective"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
