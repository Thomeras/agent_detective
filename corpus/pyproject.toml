[project]
name = "agent-detective-corpus"
version = "0.1.0"
description = "Foreign-trace corpus: third-party topologies instrumented from outside, with ground-truth labels"
requires-python = ">=3.12"
# Recording needs the real OTel SDK — that is the whole point, the spans must
# not come from our own exporter. Replay (what CI runs) needs only the CLI.
dependencies = ["opentelemetry-sdk>=1.20", "agent-detective"]

# Recording drives the foreign project in-process, so it needs THAT project's
# runtime. Replay — which is what CI does — needs none of this.
[project.optional-dependencies]
record = ["openai>=1.60.0", "python-dotenv>=1.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corpus"]
