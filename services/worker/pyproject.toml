[project]
# Distribution name, NOT the import package (which stays `worker`). The bare
# name `worker` is taken on PyPI by an unrelated project, and pip merges the
# index with any --find-links: a clean `pip install agent-detective` resolved
# `worker` to that stranger's 2018 release instead of this one. Namespacing the
# distribution is what makes the dependency unambiguous.
name = "agent-detective-worker"
version = "0.1.0"
description = "Two-tier detection/scoring/blame pipeline over Redis Streams (build spec section 4)"
authors = [{ name = "Tomáš Jeřábek" }]
requires-python = ">=3.12"
# BUSL-1.1 is the SPDX identifier for the Business Source License 1.1 (BSL-1.0
# is Boost's, an entirely different licence — do not "fix" this to BSL).
license = "BUSL-1.1"
# Core = what the tier1/tier2 pipeline itself needs. The database, stream and
# object-store clients are an extra because the pipeline is protocol-seamed:
# `worker.repository` holds only the Repo protocol, and redis/minio are
# imported lazily inside their client constructors. This is what lets the
# local-mode CLI (packages/detective_cli) run the real pipeline in-process
# with no infrastructure installed. The long-running service wants
# `worker[server]` — which is how the root workspace project depends on it.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langdetect>=1.0.9",
    "blame-engine",
]

[project.urls]
Homepage = "https://github.com/Thomeras/agent_detective"

[project.optional-dependencies]
server = [
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "minio>=7.2",
]

[tool.uv.sources]
blame-engine = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution is `agent-detective-worker`; the import package it ships is
# `worker`, so hatchling cannot infer one from the other.
[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.hatch.build.targets.sdist]
include = ["worker", "tests", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
