[project]
name = "worker"
version = "0.1.0"
description = "Two-tier detection/scoring/blame pipeline over Redis Streams (build spec section 4)"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "minio>=7.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "blame-engine",
]

[tool.uv.sources]
blame-engine = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
