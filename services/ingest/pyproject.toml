[project]
name = "ingest"
version = "0.1.0"
description = "OTLP/HTTP trace ingest service (build spec section 6.2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "clickhouse-connect>=0.8",
    "redis>=5.0",
    "minio>=7.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "otel-mapper",
    "opentelemetry-proto>=1.25",
]

[tool.uv.sources]
otel-mapper = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
