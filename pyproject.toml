[project]
# The workspace root, NOT the shipped distribution: the pip-installable
# `agent-detective` is packages/detective_cli, which builds a wheel. Naming the
# root differently keeps that name free for the thing users actually install.
name = "agent-detective-workspace"
version = "0.1.0"
description = "Development workspace for Agent Detective (see packages/detective_cli for the distribution)"
requires-python = ">=3.12"
dependencies = [
    "blame-engine",
    "otel-mapper",
    "detective-sdk",
    "detective-ci",
    "agent-detective",
    "ingest",
    # The deployed service wants the database/stream/object-store clients; the
    # core alone is what the local-mode CLI installs.
    "agent-detective-worker[server]",
    "api",
]

# Virtual workspace root: no build-system, so the root itself is never packaged.
[tool.uv.workspace]
members = ["packages/*", "services/*", "corpus"]

[tool.uv.sources]
blame-engine = { workspace = true }
otel-mapper = { workspace = true }
detective-sdk = { workspace = true }
detective-ci = { workspace = true }
agent-detective = { workspace = true }
ingest = { workspace = true }
agent-detective-worker = { workspace = true }
api = { workspace = true }

# importlib mode avoids test-module name collisions across workspace members
# that use the same file basenames (e.g. tests/test_smoke.py).
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Needed to author and validate the migrations under db/.
    "alembic>=1.13",
    "sqlalchemy>=2.0",
]
