name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace (all packages, all groups)
        run: uv sync --all-packages --all-groups --frozen

      # Each package's test suite runs from its own directory. Service test
      # modules import shared helpers as `from conftest import ...`, which
      # resolves unambiguously only when pytest's rootdir is the package dir
      # (all service source roots are on sys.path via the workspace .pth).
      - name: blame_engine (coverage >= 90%)
        working-directory: packages/blame_engine
        run: >
          uv run --package blame-engine pytest tests
          --cov=blame_engine --cov-report=term-missing --cov-fail-under=90

      - name: otel_mapper
        working-directory: packages/otel_mapper
        run: uv run --package otel-mapper pytest tests

      - name: detective_sdk
        working-directory: packages/detective_sdk
        run: uv run --package detective-sdk pytest tests

      - name: corpus (foreign traces, replay only)
        working-directory: corpus
        run: uv run --package agent-detective-corpus pytest tests

      - name: detective_ci
        working-directory: packages/detective_ci
        run: uv run --package detective-ci pytest tests

      - name: detective_cli (agent-detective, the pip distribution)
        working-directory: packages/detective_cli
        run: uv run --package agent-detective pytest tests

      - name: ingest
        working-directory: services/ingest
        run: uv run --package ingest pytest tests

      - name: api
        working-directory: services/api
        run: uv run --package api pytest tests

      - name: worker
        working-directory: services/worker
        run: uv run --package agent-detective-worker pytest tests

  distribution:
    name: pip distribution (build + clean install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build agent-detective and its workspace dependencies
        run: |
          set -e
          for pkg in blame-engine otel-mapper detective-sdk detective-ci \
                     agent-detective-worker agent-detective; do
            uv build --package "$pkg"
          done
          ls -l dist/

      # The regression this job exists for: `worker` (the old distribution
      # name) is taken on PyPI by an unrelated project, and pip merges the
      # index with --find-links, so a clean install silently resolved the
      # dependency to a stranger's 2018 release. Installing WITHOUT --no-index
      # is deliberate — it is the only way to catch that class of collision.
      - name: Install into a clean environment
        run: |
          set -e
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --find-links dist agent-detective
          /tmp/clean/bin/pip list --format=freeze | tee /tmp/installed.txt

      - name: Assert no server-only dependency leaked into the local install
        # Local mode must install without a database, broker or object store;
        # if one of these appears, the worker's [server] extra has leaked into
        # its core dependencies.
        run: |
          set -e
          for forbidden in sqlalchemy asyncpg redis minio; do
            if grep -qi "^${forbidden}==" /tmp/installed.txt; then
              echo "::error::${forbidden} was installed into the local-mode environment"
              exit 1
            fi
          done

      - name: Analyse the recorded demo traces with the installed console script
        run: |
          set -e
          /tmp/clean/bin/detective --version
          # The faulted trace's injected fault is a hallucination, which only
          # the judged channel can see; with no judge configured the honest
          # answer is NOT VERIFIED, and --fail-on-unverified must say so.
          /tmp/clean/bin/detective analyze testdata/demo_pipeline_faulted.json | tee /tmp/out.txt
          grep -q "NOT VERIFIED" /tmp/out.txt
          if /tmp/clean/bin/detective analyze testdata/demo_pipeline_faulted.json \
               --fail-on-unverified > /dev/null; then
            echo "::error::--fail-on-unverified should have exited non-zero"
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  e2e:
    name: End-to-end acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build and start the stack
        # depends_on pulls in postgres, clickhouse, redis, minio, migrate and
        # createbuckets automatically. web is not needed for the acceptance test.
        run: docker compose up -d --build api ingest worker mock-llm

      - name: Wait for services to become healthy
        run: |
          set -e
          for url in \
            http://localhost:8001/health \
            http://localhost:8000/health \
            http://localhost:8080/health; do
            echo "waiting for $url"
            for i in $(seq 1 60); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                echo "  up"
                break
              fi
              if [ "$i" = "60" ]; then
                echo "  timed out waiting for $url"
                docker compose ps
                docker compose logs
                exit 1
              fi
              sleep 3
            done
          done

      - name: Run E2E acceptance test
        run: uv run pytest tests/e2e -v

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
